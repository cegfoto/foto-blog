<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Página Preta</title>
    <style>
      :root {
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #000000;
        overflow: hidden;
      }

      body {
        position: relative;
        min-height: 100vh;
      }

      .pixel-marker {
        position: absolute;
        bottom: 50px;
        width: 30px;
        height: 30px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #ffffff;
        font-size: 10px;
        line-height: 1;
        font-family: monospace;
        white-space: nowrap;
      }

      .projectile {
        position: fixed;
        z-index: 1;
        color: #ffffff;
        font-size: 10px;
        line-height: 1;
        font-family: monospace;
        pointer-events: none;
        animation: projectile-rise 1.2s linear forwards;
      }

      @keyframes projectile-rise {
        from {
          transform: translateY(0);
        }

        to {
          transform: translateY(-100vh);
        }
      }

      .score-panel {
        position: absolute;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        color: #ffffff;
        font-family: monospace;
        text-align: center;
      }

      .score-panel h3 {
        margin: 0;
        font-size: 18px;
        line-height: 1;
      }

      .score-value {
        font-size: 18px;
        font-weight: bold;
      }

      .score-target {
        position: absolute;
        top: 0;
        left: 0;
        color: #ffffff;
        font-size: 18px;
        font-family: monospace;
        font-weight: bold;
        line-height: 1;
      }
    </style>
  </head>
  <body>
    <div class="score-panel">
      <h3>score <span class="score-value">0</span></h3>
    </div>
    <div class="score-target">50</div>
    <div class="pixel-marker">i--I--i</div>

    <script>
      const badge = document.querySelector('.score-target');
      const scoreValue = document.querySelector('.score-value');
      const marker = document.querySelector('.pixel-marker');
      const scorePanel = document.querySelector('.score-panel');
      let markerX = window.innerWidth / 2 - marker.offsetWidth / 2;
      let countdownInterval;
      let respawnTimeout;
      let score = 0;
      const projectiles = new Set();

      function updateMarkerPosition() {
        marker.style.left = `${markerX}px`;
      }

      function respawnBadge() {
        const panelRect = scorePanel.getBoundingClientRect();
        const markerRect = marker.getBoundingClientRect();
        const maxLeft = Math.max(0, window.innerWidth - badge.offsetWidth);
        const minTop = panelRect.bottom;
        const maxTop = markerRect.top - badge.offsetHeight;
        const randomTop = minTop + Math.random() * Math.max(0, maxTop - minTop);
        const randomLeft = Math.max(0, Math.random() * maxLeft);

        respawnTimeout = undefined;
        badge.style.left = `${randomLeft}px`;
        badge.style.top = `${randomTop}px`;
        badge.style.display = 'block';
        badge.textContent = '50';

        startCountdown(50);
      }

      function startCountdown(initialValue) {
        clearInterval(countdownInterval);
        let countdown = initialValue;
        badge.textContent = countdown;

        countdownInterval = setInterval(() => {
          if (countdown > 0) {
            countdown -= 1;
            badge.textContent = countdown;
          } else {
            clearInterval(countdownInterval);
            badge.style.display = 'none';
            respawnTimeout = setTimeout(respawnBadge, 500);
          }
        }, 1000);
      }

      function resetBadgeAfterHit() {
        const hitValue = Number.parseInt(badge.textContent, 10) || 0;

        score += hitValue;
        scoreValue.textContent = score;
        clearInterval(countdownInterval);
        badge.textContent = '0';
        badge.style.display = 'block';

        if (!respawnTimeout) {
          respawnTimeout = setTimeout(respawnBadge, 500);
        }
      }

      function checkProjectileCollision(projectile) {
        if (!projectiles.has(projectile)) {
          return;
        }

        const projectileRect = projectile.getBoundingClientRect();
        const badgeRect = badge.getBoundingClientRect();
        const hasHit = projectileRect.left < badgeRect.right
          && projectileRect.right > badgeRect.left
          && projectileRect.top < badgeRect.bottom
          && projectileRect.bottom > badgeRect.top;

        if (hasHit) {
          projectiles.forEach((activeProjectile) => activeProjectile.remove());
          projectiles.clear();
          resetBadgeAfterHit();
          return;
        }

        requestAnimationFrame(() => checkProjectileCollision(projectile));
      }

      function fireProjectiles() {
        const markerRect = marker.getBoundingClientRect();
        const projectileWidth = 8;
        const positions = [
          markerRect.left,
          markerRect.right - projectileWidth
        ];

        positions.forEach((left) => {
          const projectile = document.createElement('span');
          projectile.className = 'projectile';
          projectile.textContent = 'I';
          projectile.style.left = `${left}px`;
          projectile.style.top = `${markerRect.top}px`;
          projectile.addEventListener('animationend', () => {
            projectiles.delete(projectile);
            projectile.remove();
          });
          document.body.appendChild(projectile);
          projectiles.add(projectile);
          requestAnimationFrame(() => checkProjectileCollision(projectile));
        });
      }

      updateMarkerPosition();
      respawnBadge();

      window.addEventListener('keydown', (event) => {
        if (event.key === ' ') {
          event.preventDefault();
          if (!event.repeat) {
            fireProjectiles();
          }
        }

        if (event.key === 'ArrowLeft') {
          const maxX = window.innerWidth - marker.offsetWidth;
          markerX = Math.max(0, markerX - 10);
          updateMarkerPosition();
        }
      });

      window.addEventListener('keydown', (event) => {
        if (event.key === 'ArrowRight') {
          const maxX = window.innerWidth - marker.offsetWidth;
          markerX = Math.min(maxX, markerX + 10);
          updateMarkerPosition();
        }
      });
    </script>
  </body>
</html>
